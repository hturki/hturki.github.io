{% include base_path %}

<div>
    {% if post.image %}
    <div class="publication-teaser">
        <img src="{{ base_path }}/images/{{ post.image }}" alt="">
    </div>
    {% endif %}

    <div class="publication-info">
        <div><h3>{{ post.title }}</h3></div>
        <div>{{ post.authors }}</div>
        <div class="publication-venue">{{ post.venue }}</div>
        <div>
            {% if post.website %}
                <a href="{{post.website}}">Website</a>
            {% endif %}
            {% if post.paper %}
                <a href="{{post.paper}}">Paper</a>
            {% endif %}
            {% if post.code %}
                <a href="{{post.code}}">Code</a>
            {% endif %}
        </div>
    </div>
</div>
