{% include base_path %}

<div>
    {% if post.image %}
    <div class="publication-teaser">
        <img src="{{ base_path }}/images/{{ post.image }}" alt="">
    </div>
    {% endif %}

    <div class="publication-info">
        <div><h3>{{ post.title }}</h3></div>
        <div>{{ post.authors }}</div>
        <div>{{ post.venue }}</div>
        <div>
            {% if post.paper %}
                <a href="{{post.paper}}" class="button">Paper</a>
            {% endif %}
            {% if post.website %}
                <a href="{{post.website}}" class="button">Website</a>
            {% endif %}
            {% if post.github %}
                <a href="{{post.github}}" class="button">Github</a>
            {% endif %}
        </div>
    </div>
</div>
