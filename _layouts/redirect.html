<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title | escape }}</title>
    {% if page.indexable %}<link rel="canonical" href="{{ page.redirect_url | absolute_url }}">{% else %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect_url }}">
    <script>window.location.replace({{ page.redirect_url | jsonify }});</script>
</head>
<body>
    <p>Redirecting to <a href="{{ page.redirect_url }}">{{ page.title | escape }}</a>.</p>
</body>
</html>
