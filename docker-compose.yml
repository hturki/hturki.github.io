services:
  jekyll:
    image: jekyll/jekyll:4
    command: jekyll serve --watch --force_polling --livereload
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - jekyll-bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  jekyll-bundle:
